<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Leocadia Mathias</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ---------- GENERAL ---------- */
*{margin:0; padding:0; box-sizing:border-box;}
body{
    font-family:'Poppins',sans-serif;
    background:#020617;
    color:white;
}

/* ---------- NAVBAR ---------- */
.navbar{
    position:fixed;
    top:0;
    width:100%;
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    backdrop-filter:blur(12px);
    background:rgba(2,6,23,0.7);
    border-bottom:1px solid rgba(255,255,255,0.1);
    z-index:1000;
}

.logo{
    color:#38bdf8;
    font-weight:600;
    font-size:1.4rem;
}

.nav-links{
    display:flex;
    gap:15px;
    list-style:none;
}

.nav-links a{
    padding:8px 18px;
    border-radius:30px;
    color:#cbd5e1;
    text-decoration:none;
    transition:0.3s;
}

.nav-links a:hover{
    background:rgba(56,189,248,0.1);
}

.nav-links a.active{
    background:linear-gradient(135deg,#38bdf8,#6366f1);
    color:white;
}

/* ---------- HEADER ---------- */
.page-header{
    padding-top:120px;
    text-align:center;
    margin-bottom:40px;
}

.page-header h1{
    font-size:2.5rem;
}

/* ---------- CONTACT LAYOUT ---------- */
.contact-container{
    display:flex;
    justify-content:space-between;
    gap:40px;
    max-width:1100px;
    margin:0 auto;
    padding:0 20px;
}

.contact-info,
.contact-form{
    flex:1;
    min-width:320px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    padding:30px;
    border-radius:15px;
    transition:0.4s;
}

.contact-info:hover,
.contact-form:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 30px rgba(56,189,248,0.3);
}

/* ---------- ICONS ---------- */
.contact-icons{
    margin-top:25px;
    display:flex;
    gap:20px;
}

.icon{
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    position:relative;
    cursor:pointer;
}

/* SVG */
.icon svg{
    width:24px;
    height:24px;
    fill:white;
    z-index:2;
}

/* COLORS */
.whatsapp{background:#25D366;}
.email{background:#EA4335;}
.phone{background:#0ea5e9;}

/* PULSE */
.icon::after{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:inherit;
    opacity:0.6;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{transform:scale(1); opacity:0.6;}
    70%{transform:scale(1.6); opacity:0;}
    100%{opacity:0;}
}

/* TOOLTIP */
.icon::before{
    content:attr(data-tooltip);
    position:absolute;
    bottom:70px;
    background:#020617;
    padding:6px 10px;
    border-radius:6px;
    font-size:12px;
    opacity:0;
    transition:0.3s;
}

.icon:hover::before{
    opacity:1;
}

/* ---------- FORM ---------- */
.booking-form{
    display:flex;
    flex-direction:column;
    gap:15px;
    margin-top:20px;
}

.booking-form input,
.booking-form select,
.booking-form textarea{
    padding:12px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.05);
    color:white;
}

.booking-form button{
    padding:14px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#38bdf8,#6366f1);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.booking-form button:hover{
    transform:scale(1.05);
}

/* ---------- POPUP ---------- */
.success-popup{
    display:none;
    margin-top:10px;
    padding:10px;
    background:#38bdf8;
    border-radius:8px;
    text-align:center;
}

/* ---------- FOOTER ---------- */
footer{
    text-align:center;
    padding:20px;
    margin-top:40px;
}

/* ---------- RESPONSIVE ---------- */
@media(max-width:768px){
    .contact-container{
        flex-direction:column;
    }
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

<!-- SCRIPT -->
<script>
document.getElementById("bookingForm").addEventListener("submit", function(e){
    e.preventDefault();

    let name = document.getElementById("name").value;
    let service = document.getElementById("service").value;

    let phone = "255758785047";

    let text = `Hello, I want ${service}. Name: ${name}`;

    document.getElementById("bookingSuccess").style.display = "block";

    setTimeout(()=>{
        window.open(`https://wa.me/${phone}?text=${text}`, "_blank");
        this.reset();
    },1000);
});
</script>

</body>
