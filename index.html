<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leocadia Mathias | Advocate</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* ---------- RESET ---------- */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#020617;
    color:white;
    overflow-x:hidden;
}

/* ---------- PARTICLES ---------- */
#particles{
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
}

/* ---------- NAVBAR ---------- */
.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    backdrop-filter:blur(12px);
    background:rgba(2,6,23,0.7);
    border-bottom:1px solid rgba(255,255,255,0.1);
    z-index:1000;
}

.logo{
    color:#38bdf8;
    font-weight:600;
    font-size:1.4rem;
}

/* ---------- NAV LINKS ---------- */
.nav-links{
    display:flex;
    gap:15px;
    list-style:none;
}

.nav-links a{
    padding:8px 18px;
    border-radius:30px;
    border:1px solid transparent;
    font-size:0.9rem;
    color:#cbd5e1;
    text-decoration:none;
    transition:0.3s;
}

.nav-links a:hover{
    color:white;
    border:1px solid rgba(56,189,248,0.5);
    background:rgba(56,189,248,0.1);
    box-shadow:0 0 10px rgba(56,189,248,0.3);
    transform:translateY(-2px);
}

.nav-links a.active{
    background:linear-gradient(135deg,#38bdf8,#6366f1);
    color:white;
    box-shadow:0 0 15px rgba(56,189,248,0.5);
}

/* ---------- MENU BUTTON (FIXED) ---------- */
.menu-btn{
    position:fixed;
    top:18px;
    right:20px;
    width:30px;
    height:22px;
    display:none;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
    z-index:2000;
}

.menu-btn span{
    display:block;
    height:3px;
    width:100%;
    background:white;
    border-radius:5px;
    transition:0.4s;
}
/* ANIMATION TO X */
.menu-btn.active span:nth-child(1){
    transform:rotate(45deg) translate(5px,5px);
}

.menu-btn.active span:nth-child(2){
    opacity:0;
}

.menu-btn.active span:nth-child(3){
    transform:rotate(-45deg) translate(6px,-6px);
}

/* ---------- OVERLAY ---------- */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(5px);
    top:0;
    left:0;
    opacity:0;
    visibility:hidden;
    transition:0.3s;
    z-index:1400;
}

.overlay.active{
    opacity:1;
    visibility:visible;
}


/* ---------- SIDEBAR UPGRADE ---------- */
.sidebar{
    position:fixed;
    top:0;
    right:-100%;
    width:260px;
    height:100%;
    background:rgba(2,6,23,0.95);
    backdrop-filter:blur(15px);
    padding:100px 30px;
    transition:0.4s ease;
    z-index:1500;
    box-shadow:-5px 0 20px rgba(0,0,0,0.5);
}

.sidebar.active{
    right:0;
}

/* SIDEBAR LINKS */
.sidebar a{
    display:block;
    margin:20px 0;
    color:#cbd5e1;
    text-decoration:none;
    font-size:1.2rem;
    transition:0.3s;
}

.sidebar a:hover{
    color:#38bdf8;
    transform:translateX(5px);
}

/* ---------- RESPONSIVE ---------- */
@media(max-width:768px){

    .nav-links{
        display:none;
    }

    .menu-btn{
        display:flex;
    }
}

/* ---------- HERO ---------- */
.hero{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.hero h1{
    font-size:3rem;
}

.typing{
    color:#38bdf8;
}

/* ---------- BUTTON ---------- */
.btn{
    display:inline-block;
    margin-top:20px;
    padding:14px 30px;
    background:linear-gradient(135deg,#38bdf8,#6366f1);
    border-radius:30px;
    text-decoration:none;
    color:white;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

/* ---------- SECTION ---------- */
.section{
    padding:100px 20px;
    text-align:center;
}

/* ---------- CARDS ---------- */
.cards{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin-top:40px;
}

.card{
    background:rgba(255,255,255,0.05);
    padding:30px;
    border-radius:15px;
    width:250px;
    opacity:0;
    transform:translateY(50px);
    transition:0.6s;
}

.card.show{
    opacity:1;
    transform:translateY(0);
}

.card:hover{
    transform:translateY(-10px);
}

/* ---------- Booking Form ---------- */
.booking-form{
    max-width:500px;
    margin:30px auto;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.booking-form input,
.booking-form select,
.booking-form textarea{
    padding:12px 15px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.05);
    color:white;
    font-size:1rem;
}

.booking-form select{
    appearance:none;
    cursor:pointer;
}

.booking-form button{
    padding:14px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#38bdf8,#6366f1);
    color:white;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
}

.booking-form button:hover{
    transform:scale(1.05);
}

/* ---------- Success Popup ---------- */
.success-popup{
    display:none;
    text-align:center;
    padding:12px 20px;
    background:rgba(56,189,248,0.9);
    color:white;
    border-radius:10px;
    font-weight:600;
    margin-top:15px;
    animation:fadeIn 0.5s ease;
}

/* Fade in/out */
@keyframes fadeIn{
    from {opacity:0;}
    to {opacity:1;}
}
@keyframes fadeOut{
    from {opacity:1;}
    to {opacity:0;}
}

/* ---------- FOOTER ---------- */
footer{
    text-align:center;
    padding:20px;
    background:#020617;
}

/* ---------- RESPONSIVE ---------- */
@media(max-width:768px){

    .nav-links{
        display:none;
    }

    .menu-btn{
        display:block;
    }
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">Logo</div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <a href="contact.html">Contacts</a>
    </ul>
</nav>

<!-- HAMBURGER BUTTON -->
<div class="menu-btn" id="menuBtn">
    <span></span>
    <span></span>
    <span></span>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="contact.html">Contacts</a>
</div>

<!-- HERO -->
<section class="hero">
    <div>
        <h1>I am <span class="typing"></span></h1>
        <a href="#contact" class="btn">Book Consultation</a>
    </div>
</section>

<!-- SERVICES -->
<section class="section">
    <h2>Practice Areas</h2>
    <div class="cards">
        <div class="card">Legal Consultation</div>
        <div class="card">Client Representation</div>
        <div class="card">Document Drafting</div>
    </div>
</section>

<section class="section" id="booking">
  <h2>Book a Service</h2>

  <form id="bookingForm" class="booking-form">
    
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>

    <select id="service" required>
      <option value="" disabled selected>Select Service</option>
      <option value="Legal Consultation">Legal Consultation</option>
      <option value="Client Representation">Client Representation</option>
      <option value="Document Drafting">Document Drafting</option>
      <option value="Other Services">Other Services</option>
    </select>

    <input type="date" id="date" required>
    <textarea id="message" placeholder="Additional Notes" required></textarea>

    <button type="submit">Book via WhatsApp</button>
  </form>

  <div id="bookingSuccess" class="success-popup">
    Redirecting to WhatsApp...
  </div>
</section>

<script>
document.getElementById("bookingForm").addEventListener("submit", function(e){
    e.preventDefault();

    // Get values
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let service = document.getElementById("service").value;
    let date = document.getElementById("date").value;
    let message = document.getElementById("message").value;

    // Your WhatsApp number (IMPORTANT)
    let phone = "255758785047"; // replace with your number (no + sign)

    // Create message
    let text = `Hello, I would like to book for your service.%0A
Name: ${name}%0A
Email: ${email}%0A
Service: ${service}%0A
Date: ${date}%0A
Message: ${message}`;

    // Show popup
    let popup = document.getElementById("bookingSuccess");
    popup.style.display = "block";

    // Redirect to WhatsApp
    setTimeout(()=>{
        window.open(`https://wa.me/${phone}?text=${text}`, "_blank");
        popup.style.display = "none";
        document.getElementById("bookingForm").reset();
    }, 1000);
});
</script>

<footer>
    <p>© 2026 Leocadia Mathias</p>
</footer>

<script src="https://cdn.emailjs.com/dist/email.min.js"></script>

<script>

/* ---------- SIDEBAR ---------- */
function toggleMenu(){
    document.getElementById('sidebar').classList.toggle('active');
}

/* ---------- TYPING EFFECT ---------- */
const words = ["an Advocate", "a Legal Consultant", "Here to Help You"];
let i=0, j=0, currentWord="", isDeleting=false;

function type(){
    currentWord = words[i];

    if(isDeleting){
        j--;
    }else{
        j++;
    }

    document.querySelector(".typing").textContent = currentWord.substring(0,j);

    if(!isDeleting && j===currentWord.length){
        isDeleting=true;
        setTimeout(type,1000);
        return;
    }

    if(isDeleting && j===0){
        isDeleting=false;
        i=(i+1)%words.length;
    }

    setTimeout(type,100);
}

type();

/* ---------- SCROLL ANIMATION ---------- */
const cards = document.querySelectorAll('.card');

window.addEventListener('scroll',()=>{
    cards.forEach(card=>{
        let position = card.getBoundingClientRect().top;
        let screen = window.innerHeight;

        if(position < screen - 100){
            card.classList.add('show');
        }
    });
});

/* ---------- PARTICLES ---------- */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];

for(let i=0;i<100;i++){
    particlesArray.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        size:Math.random()*2,
        speedX:Math.random()*0.5,
        speedY:Math.random()*0.5
    });
}

function animateParticles(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particlesArray.forEach(p=>{
        p.x+=p.speedX;
        p.y+=p.speedY;

        if(p.x>canvas.width) p.x=0;
        if(p.y>canvas.height) p.y=0;

        ctx.fillStyle="#38bdf8";
        ctx.fillRect(p.x,p.y,p.size,p.size);
    });

    requestAnimationFrame(animateParticles);
}

animateParticles();

/* ---------- FORM ---------- */
function handleSubmit(e){
    e.preventDefault();
    document.getElementById("success").style.display="block";
}


   (function(){
      emailjs.init("YOUR_PUBLIC_KEY"); // Replace with your EmailJS public key
   })();

const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

// OPEN / CLOSE MENU
menuBtn.onclick = () => {
    menuBtn.classList.toggle("active");
    sidebar.classList.toggle("active");
    overlay.classList.toggle("active");
};

// CLOSE WHEN CLICK OVERLAY
overlay.onclick = () => {
    menuBtn.classList.remove("active");
    sidebar.classList.remove("active");
    overlay.classList.remove("active");
};

</script>

</body>
</html>
